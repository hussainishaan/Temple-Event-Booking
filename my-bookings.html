<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Temple & Event Booking System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>🏛️ Temple & Event Booking</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Browse Events</a></li>
                <li><a href="my-bookings.html" class="active">My Bookings</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h2>My Bookings</h2>
        
        <div class="search-section">
            <input type="email" id="emailSearch" placeholder="Enter your email to view bookings...">
            <button id="searchBtn" class="btn btn-primary">Search Bookings</button>
        </div>

        <div id="bookingsError" class="error-message" style="display: none;"></div>
        <div id="bookingsSuccess" class="success-message" style="display: none;"></div>

        <div class="bookings-list" id="bookingsList">
            <!-- Bookings will be loaded here by JavaScript -->
        </div>
    </div>

    <!-- Modal for booking details -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="bookingDetailsContent">
                <!-- Booking details will be loaded here -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Temple & Event Booking System. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
